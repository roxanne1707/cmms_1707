name: Maintenance container verification
on:
  push:
    branches: ['feat/mysql-maintenance']
    paths: ['api/**', 'scripts/**', 'compose.maintenance-verification.yml', '.github/workflows/maintenance-containers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Run real PostgreSQL and SMTP Testcontainers
        shell: bash
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/container-start.txt"
          mvn -B -f api/pom.xml '-Dtest=RoleIntegrationTest,DeliveryProtocolContainerIT,SharedRateLimitContainerIT,EventRetentionContainerIT' test > "$RUNNER_TEMP/container-maven.log" 2>&1
      - name: Require all explicit container tests to pass without skips
        if: always()
        run: python scripts/summarize-maintenance-tests.py --since "$(cat "$RUNNER_TEMP/container-start.txt")" --log "$RUNNER_TEMP/container-maven.log" --min-tests 50 --require-no-skips --output "$RUNNER_TEMP/testcontainers-summary.json"
      - name: Verify alert expressions, firing and resolution
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/observability:/rules:ro" -w /rules prom/prometheus:v3.16.0 test rules maintenance-alerts.test.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-testcontainers-summary
          path: ${{ runner.temp }}/testcontainers-summary.json
  compose-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build, boot, exercise and restart isolated PG and MySQL apps
        run: python scripts/verify-maintenance-containers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-container-app-summary
          path: ${{ runner.temp }}/cmms-container-summary.json
