# Disposable CI deployment only. No host data mounts and no external network.
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: maintenance-lab
  SERVER_ADDRESS: 0.0.0.0
  SERVER_PORT: 8080
  JAVA_OPTS: -Xmx768m -XX:ActiveProcessorCount=2
  CMMS_LAB_METRICS_PASSWORD: ${CI_METRICS_PASSWORD:?generated by verification runner}
  JWT_SECRET_KEY: ${CI_JWT_SECRET:?generated by verification runner}
  CMMS_BOOTSTRAP_ADMIN_EMAIL: ${CI_ADMIN_EMAIL:?generated by verification runner}
  CMMS_BOOTSTRAP_ADMIN_PASSWORD: ${CI_ADMIN_PASSWORD:?generated by verification runner}
  PUBLIC_FRONT_URL: http://127.0.0.1:38089
  PUBLIC_API_URL: http://127.0.0.1:38089
  MAIL_RECIPIENTS: ''
  STORAGE_TYPE: MINIO
  ENABLE_EMAIL_NOTIFICATIONS: 'false'
  ENABLE_MAIL_HEALTH_CHECK: 'false'
  LICENSE_KEY: ''
  SENTRY_DSN: ''
  KEYGEN_PRODUCT_TOKEN: ''
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  LAB_RABBIT_USER: cmms_ci
  LAB_RABBIT_PASSWORD: ${CI_DB_PASSWORD:?generated by verification runner}
  CMMS_EVENTS_EXTERNAL_DELIVERY_ENABLED: 'false'
  CMMS_EVENTS_WORKERS_ENABLED: 'true'
  CMMS_EVENTS_LISTENER_AUTO_STARTUP: 'true'
  CMMS_RATE_LIMIT_SHARED_ENABLED: 'true'
  CMMS_RATE_LIMIT_SHARED_IDENTITY_SECRET: ${CI_LIMIT_SECRET:?generated by verification runner}
  CMMS_RATE_LIMIT_SHARED_SUBJECT_BURST: 12
  CMMS_RATE_LIMIT_SHARED_SUBJECT_REFILL_SECONDS: 3600
  CMMS_RATE_LIMIT_SHARED_SUBJECT_SUSTAINED: 12
  CMMS_RATE_LIMIT_SHARED_SUBJECT_SUSTAINED_SECONDS: 3600
  CMMS_RATE_LIMIT_SHARED_ANONYMOUS_BURST: 6
  CMMS_RATE_LIMIT_SHARED_ANONYMOUS_REFILL_SECONDS: 3600
  CMMS_RATE_LIMIT_SHARED_ANONYMOUS_SUSTAINED: 30
  CMMS_RATE_LIMIT_SHARED_ANONYMOUS_SUSTAINED_SECONDS: 3600
  SPRING_QUARTZ_AUTO_STARTUP: 'false'
services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: cmms_container_pg
      POSTGRES_USER: cmms_ci
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cmms_ci -d cmms_container_pg']
      interval: 3s
      timeout: 3s
      retries: 40
  mysql:
    image: mysql:8.0.33
    # This instance contains only generated CI data; runtime user receives no SUPER grant.
    command: [--log-bin-trust-function-creators=1]
    environment:
      MYSQL_DATABASE: cmms_container_mysql
      MYSQL_USER: cmms_ci
      MYSQL_PASSWORD: ${CI_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CI_DB_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 3s
      timeout: 3s
      retries: 60
  redis:
    image: redis:8.4.0-alpine
  rabbitmq:
    image: rabbitmq:4.4.0-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cmms_ci
      RABBITMQ_DEFAULT_PASS: ${CI_DB_PASSWORD}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 40
  app-pg:
    image: cmms-maintenance-ci:${CI_IMAGE_TAG:?generated by verification runner}
    build:
      context: ./api
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cmms_container_pg
      SPRING_DATASOURCE_USERNAME: cmms_ci
      SPRING_DATASOURCE_PASSWORD: ${CI_DB_PASSWORD}
      ENHANCEMENT_QUERY_CACHE_NAMESPACE: container-pg
      CMMS_RATE_LIMIT_SHARED_NAMESPACE: ci-pg
      CMMS_EVENTS_EXCHANGE: cmms.ci.pg.events
      CMMS_EVENTS_QUEUE: cmms.ci.pg.notifications
      CMMS_EVENTS_DEAD_EXCHANGE: cmms.ci.pg.dead
      CMMS_EVENTS_DEAD_QUEUE: cmms.ci.pg.dead.notifications
    ports: ['127.0.0.1:38089:8080']
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_started}
  app-mysql:
    image: cmms-maintenance-ci:${CI_IMAGE_TAG:?generated by verification runner}
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: maintenance-lab,mysql
      MYSQL_JDBC_URL: jdbc:mysql://mysql:3306/cmms_container_mysql
      MYSQL_USER: cmms_ci
      MYSQL_PASSWORD: ${CI_DB_PASSWORD}
      MYSQL_CACHE_NAMESPACE: container-mysql
      CMMS_RATE_LIMIT_SHARED_NAMESPACE: ci-mysql
      CMMS_EVENTS_EXCHANGE: cmms.ci.mysql.events
      CMMS_EVENTS_QUEUE: cmms.ci.mysql.notifications
      CMMS_EVENTS_DEAD_EXCHANGE: cmms.ci.mysql.dead
      CMMS_EVENTS_DEAD_QUEUE: cmms.ci.mysql.dead.notifications
      SPRING_DATA_REDIS_DATABASE: 1
    ports: ['127.0.0.1:38189:8080']
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_started}
  app-pg-peer:
    profiles: [shared-limit]
    image: cmms-maintenance-ci:${CI_IMAGE_TAG:?generated by verification runner}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cmms_container_pg
      SPRING_DATASOURCE_USERNAME: cmms_ci
      SPRING_DATASOURCE_PASSWORD: ${CI_DB_PASSWORD}
      ENHANCEMENT_QUERY_CACHE_NAMESPACE: container-pg
      CMMS_RATE_LIMIT_SHARED_NAMESPACE: ci-pg
      CMMS_EVENTS_EXCHANGE: cmms.ci.pg.events
      CMMS_EVENTS_QUEUE: cmms.ci.pg.notifications
      CMMS_EVENTS_DEAD_EXCHANGE: cmms.ci.pg.dead
      CMMS_EVENTS_DEAD_QUEUE: cmms.ci.pg.dead.notifications
    ports: ['127.0.0.1:38289:8080']
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  pg-data:
  mysql-data:
networks:
  default:
    internal: true
