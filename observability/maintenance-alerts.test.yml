rule_files: [maintenance-alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'cmms_events_outbox_oldest_seconds{job="cmms-lab",instance="app"}'
        values: '400 400 400 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: CMMSOutboxStalled
        exp_alerts:
          - exp_labels: {severity: warning, job: cmms-lab, instance: app}
            exp_annotations: {summary: '维修通知 Outbox 积压超过五分钟'}
      - eval_time: 4m
        alertname: CMMSOutboxStalled
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'cmms_events_delivery_dead{job="cmms-lab",instance="app"}'
        values: '1 1 1 1 1 1 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: CMMSDeliveryDead
        exp_alerts:
          - exp_labels: {severity: warning, job: cmms-lab, instance: app}
            exp_annotations: {summary: '存在需要人工修复并补投的维修通知'}
      - eval_time: 6m
        alertname: CMMSDeliveryDead
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'cmms_events_retention_runs_total{job="cmms-lab",instance="app",mode="execute",outcome="failed"}'
        values: '0 0 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: CMMSRetentionFailed
        exp_alerts:
          - exp_labels: {severity: warning, job: cmms-lab, instance: app, mode: execute, outcome: failed}
            exp_annotations: {summary: '通知载荷清理失败，检查批次审计'}
  - interval: 1m
    input_series:
      - series: 'cmms_events_retention_overdue_seconds{job="cmms-lab",instance="app"}'
        values: '90000+0x120 0'
      - series: 'cmms_events_retention_enabled{job="cmms-lab",instance="app"}'
        values: '1+0x121'
    alert_rule_test:
      - eval_time: 120m
        alertname: CMMSRetentionOverdue
        exp_alerts:
          - exp_labels: {severity: warning, job: cmms-lab, instance: app}
            exp_annotations: {summary: '通知清理候选持续超期，检查预算和批次记录'}
      - eval_time: 121m
        alertname: CMMSRetentionOverdue
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{job="cmms-lab",instance="app"}'
        values: '0 0 0 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: CMMSNotificationMetricsUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: cmms-lab, instance: app}
            exp_annotations: {summary: '维修通知指标无法读取或应用失联'}
      - eval_time: 3m
        alertname: CMMSNotificationMetricsUnavailable
        exp_alerts: []
